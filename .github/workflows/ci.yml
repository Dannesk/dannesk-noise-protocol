
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Test, without features
        run: cargo test --locked

      - name: Test, with tokio
        run: cargo test --locked --all-features

  msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          rustup toolchain install "$v" --profile minimal --no-self-update
          rustup default "$v"

      - name: Check
        run: cargo check --locked --all-features

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable

    
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -A clippy::all -D clippy::correctness

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install cargo-deny
        run: |
          v=0.20.2
          f=cargo-deny-$v-x86_64-unknown-linux-musl
          curl -fsSL -o "$RUNNER_TEMP/$f.tar.gz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/$v/$f.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/$f.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$f" >> "$GITHUB_PATH"

      - name: Sources, bans and licences
        run: cargo deny --locked check sources bans licenses

    
      - name: Advisories (reported, never failing)
        if: ${{ !cancelled() }}
        run: |
          cargo deny --locked check advisories && exit 0
          echo "::warning title=RustSec advisories::cargo-deny reports an advisory against Cargo.lock; see this step's log."
